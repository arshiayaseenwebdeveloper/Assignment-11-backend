
<!DOCTYPE html>
<html>
<head>
    <title>API Request Practice</title>
    <link rel="stylesheet" href="type.css">
</head>
<body>

    <header>
        <h1>API Request Practice</h1>
        <p>Create and Update a Post</p>
    </header>

    <div class="container">

        <div class="box">
            <h2>Create a New Post</h2>

            <form id="postForm">

                <label>Post Title</label>
                <input type="text" id="title"
                placeholder="Enter title" required>

                <label>Post Content</label>
                <textarea id="content"
                placeholder="Write your announcement..."
                required></textarea>

                <label>User ID</label>
                <input type="number" id="userId"
                value="1" min="1" required>

                <button type="submit">Create Post (POST)</button>

            </form>
        </div>


        <div class="box">
            <h2>Update Existing Post</h2>

            <button id="putButton" class="green">
                Replace Post (PUT)
            </button>

            <button id="patchButton" class="orange">
                Change Title (PATCH)
            </button>

            <button id="deleteButton" class="red">
                Delete Post (DELETE)
            </button>
        </div>


        <div class="box">
            <h2>API Response</h2>

            <p id="message">
                Your response will appear here.
            </p>

            <pre id="result">No response yet.</pre>
        </div>

    </div>

    <script src="type.js"></script>

</body>
</html>
